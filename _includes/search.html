<div class="search" id="search" data-index="{{ "/search.json" | relative_url }}">
  <div class="search-inner">
    <label class="search-label" for="search-input">검색</label>
    <input type="search" id="search-input" class="search-input"
           placeholder="제목·본문 검색" autocomplete="off" spellcheck="false">
    <button type="button" class="search-close" id="search-close" aria-label="검색 닫기">
      <i class="fas fa-times"></i>
    </button>
  </div>
  <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
  <ul class="search-results" id="search-results"></ul>
</div>
